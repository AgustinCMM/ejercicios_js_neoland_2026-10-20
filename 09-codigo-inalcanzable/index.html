    <section class="tarjeta">
      <h2>Consigna</h2>
      <p>
        Código inalcanzable (Unreachable Code): Explica por qué a <code>x</code> nunca
        se le asignará el valor <code>30</code>, sin importar si empezamos con un
        <code>15</code>, un <code>50</code> o un <code>100</code>.
      </p>
      <pre class="codigo"><code>let x = 15;
if (x &gt; 5) { x = 20; }
else if (x &gt; 10) { x = 30; }</code></pre>
